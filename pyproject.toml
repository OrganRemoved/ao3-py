[project]
name = "ao3-py"
version = "2026.8.30"
description = "An unofficial python sdk for [Archive Of Our Own (AO3)](https://archiveofourown.org)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "httpx[http2]",
    "lxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ao3"]
